<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Exhibition — Core 1: Interaction Lab</title>
  <meta name="description" content="Fall 2026 class exhibition, Core 1: Interaction Lab, PUCD 2035.">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <header><a href="#class">Exhibition</a></header>
  <main>
    <section class="hero" aria-labelledby="course-title">
      <div class="collage">
        <div class="paper mint" aria-hidden="true"></div>
        <div class="paper blue" aria-hidden="true"></div>
        <div class="paper peach" aria-hidden="true"></div>
        <div class="paper yellow" aria-hidden="true"></div>
        <div class="paper purple" aria-hidden="true"></div>
        <h1 id="course-title">Core 1:<br>Interaction<br>Lab</h1>
        <p class="term">Fall 2026<br>PUCD 2035</p>
        <p class="exhibition-title">Class Exhibition</p>
      </div>
    </section>
    <section class="class-gallery" id="class" aria-labelledby="class-title">
      <h2 id="class-title" class="class-heading"><span class="meet">MEET</span><span class="our-class">OUR CLASS</span></h2>
      <div class="gallery-stage">
        <p class="hover-title" aria-hidden="true"></p>
        <div class="artwork-orbit"><div class="orbit-ring">
          <a class="artwork snail-artwork" href="julia.html" data-title="Essential" data-artist="Julia" aria-label="Explore Essential by Julia"><span class="artwork-icon" aria-hidden="true">🐌</span></a>
          <button class="artwork kiss-artwork" type="button" data-title="Sticker Study" data-artist="Cindy" aria-label="Sticker Study by Cindy"><span class="artwork-icon" aria-hidden="true">😘</span></button>
          <button class="artwork shell-artwork" type="button" data-title="Ocean Park No.30" data-artist="Amber" aria-label="Ocean Park No.30 by Amber"><span class="artwork-icon" aria-hidden="true">🐚</span></button>
        </div></div>
        <p class="hover-artist" aria-hidden="true"></p>
      </div>
    </section>
  </main>
  <script src="home.js"></script>
</body>
</html>
